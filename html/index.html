<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklep z Aromatami</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <header>
    <div class="logo">Sklep z Aromatami</div>
    <nav>
      <ul>
        <li><a href="index.html">Sklep</a></li>
        <li><a href="cart.html">Koszyk (<span id="cart-count">0</span>)</a></li>
        <li><a href="user-orders.html">Twoje zamówienia</a></li>
        <li><a href="#" id="logout-button">Wyloguj</a></li>
      </ul>
    </nav>
    <div id="user-info" style="color: white; padding: 10px;"></div>
  </header>
  
  <main>
    <section id="product-list">
      <!-- Lista produktów zostanie wygenerowana dynamicznie -->
    </section>
  </main>
  
  <div id="floating-notification"></div>
  
  <footer>
    <p>&copy; 2024 Sklep z Aromatami. Wszystkie prawa zastrzeżone.</p>
  </footer>
  
  <script>
    // Inicjalizacja – pobranie i renderowanie listy produktów przy załadowaniu strony
    document.addEventListener('DOMContentLoaded', async function() {
      const loggedInUser = localStorage.getItem('loggedInUser');
      const logoutButton = document.getElementById('logout-button');
      const userInfo = document.getElementById('user-info');

      if (!loggedInUser) {
        window.location.href = 'login.html';
        return;
      }
      userInfo.textContent = `Zalogowany jako: ${loggedInUser}`;

      logoutButton.addEventListener('click', function(event) {
        event.preventDefault();
        localStorage.removeItem('userId');
        localStorage.removeItem('loggedInUser');
        window.location.href = 'login.html';
      });

      // Renderujemy listę produktów
      refreshProductList();
      updateCartWidgetCount();
    });

    // Funkcja pobierająca listę produktów z API (dodajemy cache busting)
    async function refreshProductList() {
      try {
        console.log("Odświeżam listę produktów...");
        const response = await fetch('/api/products?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        const products = await response.json();
        console.log("Pobrane produkty:", products);
        const productList = document.getElementById('product-list');
        productList.innerHTML = ''; // Czyścimy zawartość

        products.forEach(product => {
          if (product.available) {
            const productItem = document.createElement('div');
            productItem.className = 'product-item';
            // Ustawiamy atrybut data-id, aby później móc odnaleźć ten element
            productItem.setAttribute('data-id', product._id.toString());

            productItem.innerHTML = `
              <h3>${product.name}</h3>
              <p class="product-quantity">Ilość dostępna: ${product.quantity}</p>
              <img src="/images/${product.image}.webp" alt="${product.name}">
              <button class="add-to-cart-btn" onclick="addToCart('${product._id}')">
                Dodaj do koszyka
              </button>
            `;
            productList.appendChild(productItem);
          }
        });
      } catch (error) {
        console.error('Błąd przy odświeżaniu listy produktów:', error);
      }
    }

    // Funkcja dodająca produkt do koszyka (wywołuje API, a następnie aktualizuje widok)
    async function addToCart(productId) {
      const userId = localStorage.getItem('userId');
      const quantity = 1;
      if (!userId) {
        alert('Musisz być zalogowany, aby dodać do koszyka.');
        return;
      }
      if (!productId) {
        alert('Brak ID produktu');
        return;
      }
      try {
        const response = await fetch('/api/cart', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, productId, quantity })
        });
        if (!response.ok) {
          const err = await response.json();
          alert(err.message || 'Błąd przy dodawaniu do koszyka');
          return;
        }
        const data = await response.json();
        console.log('Odpowiedź z API (addToCart):', data);
        // Jeśli backend zwrócił zaktualizowany produkt, aktualizujemy tylko jego widok
        if (data.updatedProduct) {
          updateProductDOM(data.updatedProduct);
        }
        // Dodatkowo, dla pewności, odświeżamy całą listę produktów po 500 ms
        setTimeout(() => {
          refreshProductList();
          updateCartWidgetCount();
        }, 500);
        showNotification('Dodano do koszyka!');
      } catch (error) {
        console.error('Błąd przy dodawaniu do koszyka (API):', error);
      }
    }

    // Funkcja aktualizująca licznik widżetu koszyka
    function updateCartWidgetCount() {
      updateCart();
    }

    // Funkcja pobierająca zawartość koszyka i aktualizująca licznik
    function updateCart() {
      const userId = localStorage.getItem('userId');
      if (!userId) return;
      fetch(`/api/cart/${userId}`, { cache: 'no-store' })
        .then(response => response.json())
        .then(cartItems => {
          const cartCountElem = document.getElementById('cart-count');
          if (cartCountElem) {
            const totalQuantity = cartItems.reduce((total, item) => total + item.quantity, 0);
            cartCountElem.textContent = totalQuantity;
          }
        })
        .catch(error => {
          console.error('Błąd przy aktualizacji koszyka:', error);
        });
    }

    // Funkcja wyświetlająca krótkie powiadomienie
    function showNotification(message) {
      const notification = document.getElementById('floating-notification');
      notification.textContent = message;
      notification.classList.add('show');
      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    // Funkcja debugująca, wymuszająca reflow i aktualizująca pojedynczy element produktu
    function updateProductDOM(updatedProduct) {
      const productId = updatedProduct._id.toString();
      console.log("Próbuję zaktualizować produkt o data-id:", productId);
      
      const productElement = document.querySelector(`.product-item[data-id="${productId}"]`);
      if (productElement) {
        const quantityElement = productElement.querySelector('.product-quantity');
        if (quantityElement) {
          console.log("Przed aktualizacją, ilość:", quantityElement.textContent);
          quantityElement.textContent = `Ilość dostępna: ${updatedProduct.quantity}`;
          console.log("Po aktualizacji, ilość:", quantityElement.textContent);
          
          // Wymuszenie reflow: tymczasowo ukrywamy i pokazujemy element
          productElement.style.display = 'none';
          productElement.offsetHeight; // Odczyt tej właściwości wymusza reflow
          productElement.style.display = '';
        }
        if (updatedProduct.quantity <= 0) {
          const btn = productElement.querySelector('.add-to-cart-btn');
          if (btn) {
            btn.disabled = true;
            btn.textContent = 'Niedostępne';
          }
        }
      } else {
        console.warn(`Nie znaleziono elementu produktu dla data-id: ${productId}`);
      }
    }
  </script>
</body>
</html>
