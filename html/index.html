<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep z Aromatami</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <header>
        <div class="logo">Sklep z Aromatami</div>
        <nav>
            <ul>
                <li><a href="index.html">Sklep</a></li>
                <li><a href="cart.html">Koszyk (<span id="cart-count">0</span>)</a></li>
                <li><a href="user-orders.html">Twoje zamówienia</a></li>
                <li><a href="#" id="logout-button">Wyloguj</a></li>
            </ul>
        </nav>
        <div id="user-info" style="color: white; padding: 10px;"></div>
    </header>

    <main>
        <section id="product-list">
            <!-- Produkty będą ładowane dynamicznie w JS -->
        </section>
    </main>

    <div id="floating-notification"></div>

    <footer>
        <p>&copy; 2024 Sklep z Aromatami. Wszystkie prawa zastrzeżone.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const productList = document.getElementById('product-list');
            const userInfo = document.getElementById('user-info');
            const loggedInUser = localStorage.getItem('loggedInUser');
            const logoutButton = document.getElementById('logout-button');

            // Sprawdzenie, czy użytkownik jest zalogowany
            if (!loggedInUser) {
                window.location.href = 'login.html';
                return;
            }

            // Wyświetlenie nazwy zalogowanego użytkownika
            if (loggedInUser) {
                userInfo.textContent = `Zalogowany jako: ${loggedInUser}`;
            }

            // Obsługa wylogowania
            logoutButton.addEventListener('click', function(event) {
                event.preventDefault();
                localStorage.removeItem('userId');
                localStorage.removeItem('loggedInUser');
                window.location.href = 'login.html';
            });

            // Pobranie listy produktów
            try {
                // UWAGA: dostosuj adres, jeśli testujesz lokalnie
                // (np. 'http://localhost:5000/api/products')
                const response = await fetch('https://kuciapki.onrender.com/api/products');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const products = await response.json();

                products.forEach(product => {
                    // Sprawdzamy, czy produkt jest oznaczony jako dostępny
                    if (product.available) {
                        const productItem = document.createElement('div');
                        productItem.className = 'product-item';

                        // Atrybut data-id, by później zaktualizować w DOM
                        productItem.setAttribute('data-id', product._id);

                        // Generujemy HTML z informacją o ilości
                        productItem.innerHTML = `
                            <h3>${product.name}</h3>
                            <p class="product-quantity">Ilość dostępna: ${product.quantity}</p>
                            <img src="/images/${product.image}.webp" alt="${product.name}">
                            <button class="add-to-cart-btn" onclick="addToCart('${product._id}')">Dodaj do koszyka</button>
                        `;
                        productList.appendChild(productItem);
                    }
                });

                // Aktualizacja licznika koszyka
                updateCartWidgetCount();

            } catch (error) {
                console.error('Error fetching products:', error);
            }
        });

        // Funkcja dodająca produkt do koszyka (API)
        async function addToCart(productId) {
            const userId = localStorage.getItem('userId');
            // "Na sztywno" dodajemy 1 sztukę (możesz zmodyfikować)
            const quantity = 1;

            if (!userId || !productId) {
                alert('Brak ID użytkownika lub produktu');
                return;
            }

            try {
                // Endpoint do dodawania do koszyka
                const response = await fetch('https://kuciapki.onrender.com/api/cart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId, productId, quantity })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                // Oczekujemy struktury: { cartItem, updatedProduct }
                const { cartItem, updatedProduct } = await response.json();
                console.log('Dodano do koszyka:', cartItem);
                console.log('Zaktualizowany produkt:', updatedProduct);

                // Aktualizacja widoku koszyka
                updateCartWidgetCount();

                // Wyświetlenie powiadomienia
                showNotification('Produkt dodany do koszyka!');

                // Zmiana ilości / usunięcie na stronie, jeśli quantity=0
                updateProductDOM(updatedProduct);

            } catch (error) {
                console.error('Error adding product to cart:', error);
                alert('Wystąpił problem przy dodawaniu produktu do koszyka.');
            }
        }

        // Funkcja aktualizująca licznik koszyka
        function updateCartWidgetCount() {
            const userId = localStorage.getItem('userId');
            if (!userId) return;

            fetch(`https://kuciapki.onrender.com/api/cart/${userId}`)
                .then(response => response.json())
                .then(cartItems => {
                    const cartCount = cartItems.reduce((acc, item) => acc + item.quantity, 0);
                    document.getElementById('cart-count').textContent = cartCount;
                })
                .catch(error => console.error('Error fetching cart count:', error));
        }

        // Funkcja wyświetlająca powiadomienie
        function showNotification(message) {
            const notification = document.getElementById('floating-notification');
            notification.textContent = message;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Nowa funkcja: aktualizacja DOM po dodaniu produktu do koszyka
        function updateProductDOM(updatedProduct) {
            // Znajdujemy diva z data-id = updatedProduct._id
            const productElem = document.querySelector(`.product-item[data-id="${updatedProduct._id}"]`);
            if (!productElem) return;

            // Zmieniamy tekst w <p class="product-quantity">
            const quantityElem = productElem.querySelector('.product-quantity');
            if (quantityElem) {
                quantityElem.textContent = `Ilość dostępna: ${updatedProduct.quantity}`;
            }

            // Jeśli ilość = 0 -> blokujemy przycisk lub usuwamy element
            if (updatedProduct.quantity <= 0) {
                const btn = productElem.querySelector('.add-to-cart-btn');
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = 'Niedostępne';
                }
                // Ewentualnie productElem.remove(); jeśli chcesz usunąć z listy
            }
        }
    </script>
</body>
</html>
