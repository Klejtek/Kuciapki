<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep z Aromatami</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <header>
        <div class="logo">Sklep z Aromatami</div>
        <nav>
            <ul>
                <li><a href="index.html">Sklep</a></li>
                <li><a href="cart.html">Koszyk (<span id="cart-count">0</span>)</a></li>
                <li><a href="user-orders.html">Twoje zamówienia</a></li>
                <li><a href="#" id="logout-button">Wyloguj</a></li>
            </ul>
        </nav>
        <div id="user-info" style="color: white; padding: 10px;"></div>
    </header>

    <main>
        <section id="product-list">
            <!-- Produkty będą ładowane dynamicznie -->
        </section>
    </main>

    <div id="floating-notification"></div>

    <footer>
        <p>&copy; 2024 Sklep z Aromatami. Wszystkie prawa zastrzeżone.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const productList = document.getElementById('product-list');
            const userInfo = document.getElementById('user-info');
            const loggedInUser = localStorage.getItem('loggedInUser');
            const logoutButton = document.getElementById('logout-button');

            if (!loggedInUser) {
                window.location.href = 'login.html';
                return;
            }

            if (loggedInUser) {
                userInfo.textContent = `Zalogowany jako: ${loggedInUser}`;
            }

            logoutButton.addEventListener('click', function(event) {
                event.preventDefault();
                localStorage.removeItem('userId');
                localStorage.removeItem('loggedInUser');
                window.location.href = 'login.html';
            });

            // Pobranie listy produktów
            try {
                // Zmień na 'http://localhost:5000/api/products' jeżeli testujesz lokalnie
                const response = await fetch('https://kuciapki.onrender.com/api/products');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const products = await response.json();

                products.forEach(product => {
                    if (product.available) {
                        const productItem = document.createElement('div');
                        productItem.className = 'product-item';
                        productItem.setAttribute('data-id', product._id); // kluczowe

                        productItem.innerHTML = `
                            <h3>${product.name}</h3>
                            <p class="product-quantity">Ilość dostępna: ${product.quantity}</p>
                            <img src="/images/${product.image}.webp" alt="${product.name}">
                            <button class="add-to-cart-btn" onclick="addToCart('${product._id}')">
                                Dodaj do koszyka
                            </button>
                        `;
                        productList.appendChild(productItem);
                    }
                });

                updateCartWidgetCount();
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        });

        async function addToCart(productId) {
            const userId = localStorage.getItem('userId');
            const quantity = 1;

            if (!userId || !productId) {
                alert('Brak ID użytkownika lub produktu');
                return;
            }

            try {
                const response = await fetch('https://kuciapki.onrender.com/api/cart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, productId, quantity })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                // Otrzymujemy { cartItem, updatedProduct }
                const { cartItem, updatedProduct } = await response.json();
                console.log('Dodano do koszyka:', cartItem);
                console.log('updatedProduct:', updatedProduct);

                updateCartWidgetCount();
                showNotification('Produkt dodany do koszyka!');

                // Zaktualizuj DOM
                updateProductDOM(updatedProduct);

            } catch (error) {
                console.error('Error adding product to cart:', error);
                alert('Wystąpił problem przy dodawaniu produktu do koszyka.');
            }
        }

        function updateCartWidgetCount() {
            const userId = localStorage.getItem('userId');
            if (!userId) return;

            fetch(`https://kuciapki.onrender.com/api/cart/${userId}`)
                .then(response => response.json())
                .then(cartItems => {
                    const cartCount = cartItems.reduce((acc, item) => acc + item.quantity, 0);
                    document.getElementById('cart-count').textContent = cartCount;
                })
                .catch(error => console.error('Error fetching cart count:', error));
        }

        function showNotification(message) {
            const notification = document.getElementById('floating-notification');
            notification.textContent = message;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Funkcja która zmienia liczbę w ".product-quantity" i blokuje przycisk
        function updateProductDOM(updatedProduct) {
            console.log('updateProductDOM -> updatedProduct:', updatedProduct);

            // Znajdź div o data-id=...
            const productElem = document.querySelector(`.product-item[data-id="${updatedProduct._id}"]`);
            if (!productElem) {
                console.log('Nie znaleziono w DOM produktu o id:', updatedProduct._id);
                return;
            }

            // Zmień tekst w .product-quantity
            const quantityElem = productElem.querySelector('.product-quantity');
            if (quantityElem) {
                quantityElem.textContent = `Ilość dostępna: ${updatedProduct.quantity}`;
            }

            // Jeśli ilość = 0 -> zablokuj przycisk lub usuń
            if (updatedProduct.quantity <= 0) {
                const btn = productElem.querySelector('.add-to-cart-btn');
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = 'Niedostępne';
                }
                // productElem.remove(); // ewentualnie usunięcie
            }
        }
    </script>
</body>
</html>
