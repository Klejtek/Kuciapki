<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklep z Aromatami</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <header>
    <div class="logo">Sklep z Aromatami</div>
    <nav>
      <ul>
        <li><a href="index.html">Sklep</a></li>
        <li><a href="cart.html">Koszyk (<span id="cart-count">0</span>)</a></li>
        <li><a href="user-orders.html">Twoje zamówienia</a></li>
        <li><a href="#" id="logout-button">Wyloguj</a></li>
      </ul>
    </nav>
    <div id="user-info" style="color: white; padding: 10px;"></div>
  </header>

  <main>
    <section id="product-list">
      <!-- Produkty będą ładowane dynamicznie -->
    </section>
  </main>

  <div id="floating-notification"></div>

  <footer>
    <p>&copy; 2024 Sklep z Aromatami. Wszystkie prawa zastrzeżone.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const productList = document.getElementById('product-list');
      const userInfo = document.getElementById('user-info');
      const loggedInUser = localStorage.getItem('loggedInUser');
      const logoutButton = document.getElementById('logout-button');

      // Sprawdzenie, czy użytkownik jest zalogowany
      if (!loggedInUser) {
        window.location.href = 'login.html';
        return;
      }

      // Wyświetlenie nazwy zalogowanego użytkownika
      userInfo.textContent = `Zalogowany jako: ${loggedInUser}`;

      // Obsługa wylogowania
      logoutButton.addEventListener('click', function(event) {
        event.preventDefault();
        localStorage.removeItem('userId');
        localStorage.removeItem('loggedInUser');
        window.location.href = 'login.html';
      });

      // Pobranie listy produktów
      try {
        const response = await fetch('/api/products');
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        const products = await response.json();

        products.forEach(product => {
          if (product.available) {
            const productItem = document.createElement('div');
            productItem.className = 'product-item';
            // Ustawiamy data-id jako string
            productItem.setAttribute('data-id', product._id.toString());

            productItem.innerHTML = `
              <h3>${product.name}</h3>
              <p class="product-quantity">Ilość dostępna: ${product.quantity}</p>
              <img src="/images/${product.image}.webp" alt="${product.name}">
              <button class="add-to-cart-btn" onclick="addToCart('${product._id}')">
                Dodaj do koszyka
              </button>
            `;
            productList.appendChild(productItem);
          }
        });

        updateCartWidgetCount();
      } catch (error) {
        console.error('Błąd przy pobieraniu produktów:', error);
      }
    });

    // Funkcja dodająca produkt do koszyka
    async function addToCart(productId) {
      const userId = localStorage.getItem('userId');
      const quantity = 1; // Dodajemy 1 sztukę

      if (!userId || !productId) {
        alert('Brak ID użytkownika lub produktu');
        return;
      }

      try {
        const response = await fetch('/api/cart', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, productId, quantity })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const { updatedProduct } = await response.json();
        console.log('Zaktualizowany produkt:', updatedProduct);

        updateCartWidgetCount();
        showNotification('Produkt dodany do koszyka!');
        updateProductDOM(updatedProduct);
      } catch (error) {
        console.error('Błąd przy dodawaniu do koszyka:', error);
        alert('Wystąpił problem przy dodawaniu produktu do koszyka.');
      }
    }

    // Funkcja aktualizująca licznik koszyka
    function updateCartWidgetCount() {
      const userId = localStorage.getItem('userId');
      if (!userId) return;

      fetch(`/api/cart/${userId}`)
        .then(response => response.json())
        .then(cartItems => {
          const cartCount = cartItems.reduce((acc, item) => acc + item.quantity, 0);
          document.getElementById('cart-count').textContent = cartCount;
        })
        .catch(error => console.error('Błąd przy aktualizacji koszyka:', error));
    }

    // Zaktualizowana funkcja do aktualizacji DOM produktu
    function updateProductDOM(updatedProduct) {
      // Konwertujemy _id do stringa
      let productId = updatedProduct._id;
      if (typeof productId !== "string") {
        productId = productId.toString();
      }
      
      // Znajdź element produktu na podstawie data-id
      const productElem = document.querySelector(`.product-item[data-id="${productId}"]`);
      console.log("Aktualizacja DOM dla produktu o id:", productId, productElem);
      
      if (productElem) {
        const quantityElem = productElem.querySelector('.product-quantity');
        if (quantityElem) {
          // Aktualizujemy tekst z nową ilością
          quantityElem.textContent = `Ilość dostępna: ${updatedProduct.quantity}`;
          console.log("Zaktualizowano ilość produktu w DOM na:", updatedProduct.quantity);
        } else {
          console.warn("Nie znaleziono elementu .product-quantity dla produktu", productId);
        }
        // Jeśli ilość jest mniejsza lub równa 0, zmień stan przycisku
        if (updatedProduct.quantity <= 0) {
          const btn = productElem.querySelector('.add-to-cart-btn');
          if (btn) {
            btn.disabled = true;
            btn.textContent = 'Niedostępne';
          }
        }
      } else {
        console.warn("Nie znaleziono elementu .product-item dla id:", productId);
      }
    }

    // Funkcja wyświetlająca powiadomienie
    function showNotification(message) {
      const notification = document.getElementById('floating-notification');
      notification.textContent = message;
      notification.classList.add('show');
      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
